version: '3.9'

services:
  app-db:
    image: postgres:15
    container_name: cm-postgres
    environment:
      POSTGRES_DB: customer_manager
      POSTGRES_USER: cmanager
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - app_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmanager"]
      interval: 5s
      retries: 5

  keycloak-db:
    image: postgres:15
    container_name: cm-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5434:5432"
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    container_name: cm-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_PORT: 5432
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev
    ports:
      - "8081:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy

volumes:
  app_pgdata:
  keycloak_pgdata: