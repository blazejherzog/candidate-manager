server:
  port: 8080

app:
  time-zone: Europe/Warsaw
  cors:
    allowed-origins: []

springdoc:
  paths-to-match: /api/**
  default-flat-param-object: true
  default-produces-media-type: application/json
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    oauth:
      client-id: cm-web
      use-pkce-with-authorization-code-grant: true

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/customer_manager
    username: cmanager
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/cm-realm
          audiences: cm-backend
  mvc:
    problemdetails:
      enabled: true
  http:
    client:
      connect-timeout: 2s
      read-timeout: 5s
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: simple

keycloak:
  url: http://localhost:8081
  realm: cm-realm
  client-id: cm-backend
  client-secret: ${KEYCLOAK_CLIENT_SECRET:}

rabbitmq:
  queues:
    - name: cm-candidate.candidate-registered
      exchange: cm.auth
      routing-key: auth.candidate-registered
      durable: true
    - name: cm-event.application-submitted
      exchange: cm.application
      routing-key: application.application-submitted
      durable: true
    - name: cm-event.application-status-changed
      exchange: cm.application
      routing-key: application.application-status-changed
      durable: true

registration:
  cleanup:
    enabled: true
    fixed-delay: PT1M
    stale-after: PT2M
    abandon-after: PT1H
    batch-size: 20

outbox:
  relay:
    enabled: true
    fixed-delay: 1000
    batch-size: 50
    confirm-timeout: 5000

messaging:
  retention:
    enabled: true
    fixed-delay: PT1H
    published-outbox-event-ttl: 7d
    processed-event-ttl: 30d
    batch-size: 1000
