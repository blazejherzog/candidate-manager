server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/customer_manager
    username: cmanager
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/cm-realm
          audiences: cm-backend
  mvc:
    problemdetails:
      enabled: true
  http:
    client:
      connect-timeout: 2s
      read-timeout: 5s
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: simple

keycloak:
  url: http://localhost:8081
  realm: cm-realm
  client-id: cm-backend
  client-secret: ${KEYCLOAK_CLIENT_SECRET:}

rabbitmq:
  queues:
    - name: candidate.created.queue
      exchange: candidate.exchange
      routing-key: candidate.created
      durable: true

outbox:
  relay:
    enabled: true
    fixed-delay: 1000
    batch-size: 50
    confirm-timeout: 5000

messaging:
  retention:
    enabled: true
    fixed-delay: PT1H
    published-outbox-event-ttl: 7d
    processed-event-ttl: 30d
    batch-size: 1000
