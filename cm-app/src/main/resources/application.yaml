server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/customer_manager
    username: cmanager
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/cm-realm
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: simple

keycloak:
  url: http://localhost:8081
  realm: cm-realm
  client-id: cm-client
  client-secret: z66o4AGkCrSWpn2jjH8j2BqmjtLV6xy6

rabbitmq:
  queues:
    - name: candidate.created.queue
      exchange: candidate.exchange
      routing-key: candidate.created
      durable: true

outbox:
  relay:
    enabled: true
    fixed-delay: 1000
    batch-size: 50
    confirm-timeout: 5000
